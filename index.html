<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai作词提示词生成器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
            position: relative; /* 添加相对定位 */
        }
        h1 .byline {
            position: absolute; /* 绝对定位 */
            bottom: -20px; /* 调整到标题右下角 */
            right: 0;
            font-size: 14px;
            color: #888;
            font-weight: normal;
        }
        .question {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #555;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            color: #888;
            resize: none;
        }
        textarea:focus {
            color: #333;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .example {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .hint {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .button-reset {
            background-color: #ff4d4d;
            color: white;
        }
        .button-reset:hover {
            background-color: #cc0000;
        }
        .button-generate {
            background-color: #4caf50;
            color: white;
        }
        .button-generate:hover {
            background-color: #45a049;
        }
        .button-tip {
            background-color: #007bff;
            color: white;
            position: relative; /* 添加相对定位 */
        }
        .button-tip:hover {
            background-color: #0056b3;
        }
         /* 弹出图片样式 */
        .tooltip-image {
            display: none;
            position: absolute;
            top: -10px; /* 调整图片位置 */
            left: 110%; /* 让图片显示在按钮右侧 */
            z-index: 10;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 600px; /* 设置图片宽度 */
            height: auto; /* 自动调整高度以保持比例 */
        }
        .button-tip:hover .tooltip-image {
            display: block;
        }
        .output {
            margin-top: 30px;
        }
        .output textarea {
            height: 300px;
        }
        /* 调整最后一个问题标题样式 */
        .last-question-title {
            font-size: 16px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }
        /* 声明样式 */
        .disclaimer {
            margin-top: 40px;
            font-size: 12px;
            color: #888;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>Ai作词提示词生成器<span class="byline">By 指北音乐</span></h1>

    <!-- 第二个问题 -->
    <div class="question">
        <h2>主题与情感</h2>

        <!-- 主题选择 -->
        <label for="theme">1. 这首歌的主题是什么？</label>
        <select id="theme">
            <option value="爱情">爱情</option>
            <option value="亲情">亲情</option>
            <option value="友情">友情</option>
            <option value="人生哲理">人生哲理</option>
            <option value="社会问题">社会问题</option>
            <option value="自然">自然</option>
            <option value="历史">历史</option>
            <option value="思乡">思乡</option>
            <option value="梦想">梦想</option>
        </select>

        <!-- 情感基调 -->
        <label for="tone">2. 情感基调（一句话描述）：</label>
        <input type="text" id="tone" placeholder="例：失恋后后悔与失落的感觉">

        <!-- 歌曲用途 -->
        <label for="purpose">3. 你希望这首歌是？</label>
        <select id="purpose">
            <option value="市场歌曲">市场歌曲</option>
            <option value="纪念礼物">纪念礼物</option>
            <option value="个性表达">个性表达</option>
        </select>
    </div>

    <!-- 第三个问题 -->
    <div class="question">
        <h2>曲式结构</h2>

        <!-- 曲式复杂度 -->
        <label for="structure">1. 你希望歌曲段落【简单/正常/复杂】：</label>
        <select id="structure">
            <option value="简单">简单</option>
            <option value="正常">正常</option>
            <option value="复杂">复杂</option>
        </select>
    </div>

    <!-- 第四个问题 -->
    <div class="question">
        <h2>音乐风格偏好</h2>

        <!-- 音乐风格 -->
        <label for="style">你希望音乐风格是？（提醒：这里的风格主要影响每句的字数）</label>
        <select id="style">
            <option value="流行">流行</option>
            <option value="古风">古风</option>
            <option value="摇滚">摇滚</option>
            <option value="民谣">民谣</option>
            <option value="说唱">说唱</option>
        </select>
    </div>

    <!-- 第五个问题 -->
    <div class="question">
        <h2>歌词视角</h2>

        <!-- 歌词视角选择 -->
        <label for="perspective">选择你喜欢的歌词视角：</label>
        <select id="perspective">
            <option value="第一人称">第一人称</option>
            <option value="第三人称">第三人称</option>
        </select>
        <div class="hint">
            提示：第一人称会更代入，更亲切。第三人称会站在旁观者视角。
        </div>
    </div>

    <!-- 第六个问题 -->
    <div class="question">
        <h2>押韵风格</h2>

        <!-- 押韵风格选择 -->
        <label for="rhyme">选择你喜欢的押韵风格：</label>
        <select id="rhyme">
            <option value="一韵到底">一韵到底</option>
            <option value="灵活换韵">灵活换韵</option>
        </select>
        <div class="hint">
            提示：一韵到底即整首歌使用一个韵脚，灵活换韵指歌词会在适当位置改变韵脚（推荐），但受制于目前的 AI 能力，这个选项的功能不保证 100% 实现。
        </div>
    </div>

    <!-- 最后一个问题 -->
    <div class="question">
        <div class="last-question-title">为了生成出来的歌词能表达出你的故事，请补充一些细节？</div>
        <textarea id="details" onfocus="if(this.value === '1. 是我的初恋\n2. 我对她一见钟情，我追求她，最终我们在一起\n3. 我为了陪她，跟她一起离开家乡去了深圳工作，每个月只有很少的假期，但是每次假期我们都会一起度过\n4. 我第一次看海，是和她一起\n5. 后来因为一些原因，我们分开了\n6. 我以为我会很洒脱，但是过了那么久，我无数次的后悔过和她分开') this.value = '';" onblur="if(this.value === '') this.value = '1. 是我的初恋\n2. 我对她一见钟情，我追求她，最终我们在一起\n3. 我为了陪她，跟她一起离开家乡去了深圳工作，每个月只有很少的假期，但是每次假期我们都会一起度过\n4. 我第一次看海，是和她一起\n5. 后来因为一些原因，我们分开了\n6. 我以为我会很洒脱，但是过了那么久，我无数次的后悔过和她分开';">1. 是我的初恋
2. 我对她一见钟情，我追求她，最终我们在一起
3. 我为了陪她，跟她一起离开家乡去了深圳工作，每个月只有很少的假期，但是每次假期我们都会一起度过
4. 我第一次看海，是和她一起
5. 后来因为一些原因，我们分开了
6. 我以为我会很洒脱，但是过了那么久，我无数次的后悔过和她分开</textarea>
        <div class="hint">
            提示：用简短的话描述，建议使用序号分行。
        </div>
    </div>

    <!-- 按钮 -->
    <div class="buttons">
        <button class="button button-reset" onclick="resetForm()">重新输入</button>
        <button class="button button-generate" onclick="generatePrompt()">生成提示词</button>
        <button class="button button-tip">
            打赏|反馈
            <img src="52yyzb.github.io/tip.png" alt="打赏图片" class="tooltip-image" width="200">
        </button>
    </div>

    <!-- 输出区域 -->
    <div class="output">
        <h2>生成的提示词</h2>
        <textarea id="output" readonly></textarea>
    </div>

    <!-- 声明 -->
    <div class="disclaimer">
        本工具创意及交互设计均为原创，未经作者书面授权不得复制、修改或用于商业用途。保留一切法律追诉权利。
    </div>

    <script>
        // 重置表单
        function resetForm() {
            document.getElementById('details').value = '1. 是我的初恋\n2. 我对她一见钟情，我追求她，最终我们在一起\n3. 我为了陪她，跟她一起离开家乡去了深圳工作，每个月只有很少的假期，但是每次假期我们都会一起度过\n4. 我第一次看海，是和她一起\n5. 后来因为一些原因，我们分开了\n6. 我以为我会很洒脱，但是过了那么久，我无数次的后悔过和她分开';
            document.getElementById('theme').value = '爱情';
            document.getElementById('tone').value = '';
            document.getElementById('purpose').value = '市场歌曲';
            document.getElementById('structure').value = '正常';
            document.getElementById('style').value = '流行';
            document.getElementById('perspective').value = '第一人称';
            document.getElementById('rhyme').value = '灵活换韵';
            document.getElementById('output').value = '';
        }

        // 生成提示词
        function generatePrompt() {
            const details = document.getElementById('details').value.trim();
            const theme = document.getElementById('theme').value;
            const tone = document.getElementById('tone').value.trim();
            const purpose = document.getElementById('purpose').value;
            const structure = document.getElementById('structure').value;
            const style = document.getElementById('style').value;
            const perspective = document.getElementById('perspective').value;
            const rhyme = document.getElementById('rhyme').value;

            // 根据音乐风格确定每行字数范围
            let lineLengthRange = '';
            if (['流行', '古风', '摇滚', '民谣'].includes(style)) {
                lineLengthRange = '7-11个字';
            } else if (style === '说唱') {
                lineLengthRange = '13-17个字';
            }

            // 根据歌曲用途生成提示词
            let purposePrompt = '';
            if (purpose === '市场歌曲') {
                purposePrompt = '这是一首市场歌曲，请选择能引起大众共鸣的切入点和内容';
            } else if (purpose === '纪念礼物') {
                purposePrompt = '这是一首送人的歌曲，请写的更真挚、更能打动到对方';
            } else if (purpose === '个性表达') {
                purposePrompt = '这是一首用来表现个性的歌曲，请选择更独特的切入点，避免使用太俗套的字词';
            }

            // 根据曲式结构生成提示词
            let structurePrompt = '';
            if (structure === '简单') {
                structurePrompt = `格式为一段体（A A1 A2 A3)，具体结构如下：
A（Verse1）
A2（Verse2）
A3（Verse3）
A4（Verse4）
A（Verse1）
A2（Verse2）

一段式的特点是用一段歌词作为基础，后面按照第一段的格式重复变化`;
            } else if (structure === '正常') {
                structurePrompt = `格式为二段体(AABB式)，具体结构如下：
A1（Verse1）
A2（Verse2）
B1（Chorus1）
B2（Chorus2）
A2（Verse2）
B1（Chorus1）
B2（Chorus2）`;
            } else if (structure === '复杂') {
                structurePrompt = `格式为三段式,具体结构如下：

A1（Verse1）
A2（Verse2）
B1（Chorus1）
B2（Chorus2）
A2（Verse2）
B1（Chorus1）
B2（Chorus2）
C（Bridge）
B1（Chorus1）
B2（Chorus2）`;
            }

            // 根据押韵风格生成提示词
            let rhymePrompt = '';
            if (rhyme === '灵活换韵') {
                rhymePrompt = `主歌（A）：1、2、4句押韵，第3句不押韵，副歌（B）：所有句子押同一韵脚，请严格执行`;
            } else if (rhyme === '一韵到底') {
                rhymePrompt = `整首歌曲用同一个韵脚，务必严格执行`;
            }

            // 组合生成的提示词
            const output = `
1. 故事细节：
【${details}】

2. 主题与情感
主题：【${theme}】
情感基调：「${tone}」
${purposePrompt}

3. 歌词结构
${structurePrompt}

4. 段落与句式
每一段的歌词为4行，每行歌词严格控制在${lineLengthRange}，断句合理。

5. 歌词视角：（${perspective}）

6. 段落特点：
A1（Verse1）段落，场景描写为主，场景请从我最开始告诉你的故事细节选取，可以根据「故事细节」来补充这一部分的内容
场景描写使用镜头语言「远近拉近/近景推远/长镜头」
远景拉近就是从大的环境逐渐聚焦到具体的物体上，例如：冷清的夜晚/路边的灯/光束笼罩着/灯下的人，从越晚逐渐聚焦到人
近景推远和上面相反
长镜头就是把同一个空间里的事物依次描写出来，衬托主题和情感基调
一个段落只需要随机使用其中一种“镜头语言”
A2（Verse2）段落以叙事描写为主，请从我最开始告诉你的故事细节里选取、
叙事用时间对比的方式，比如过去对比现在，现在对比未来，来烘托主题和情感基调

在主歌段落的时候，要适当插入人称代词，以保证沉浸感。

B（Chorus）段落，以抒情为主，抒发「${tone}」，使用比喻、拟人、排比、夸张等修辞手法，例如：“时光像沙漏 / 一点点流走。”

C（Bridge），用于对主题的转折或者升华

设计金句，并把金句放在副歌部分多次重复。

7. 押韵要求：
${rhymePrompt}

8. 其他注意事项：
确保歌词内容通俗易懂，适合大众传唱
只需要给我歌词内容，段落标记使用英文，如[Verse1]
`;

            // 输出到文本框
            document.getElementById('output').value = output.trim();
        }
    </script>
</body>
</html>
